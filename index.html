<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>接力绘 · 绘画接龙平台</title>
  <meta name="description" content="接力绘是一个绘画接龙社群：认领一个棒位，接着上一棒画下去，六棒之后看看这张图变成了什么。">
<style>
:root{
  --paper:#F3EEE4; --paper2:#FCF9F2; --ink:#15101A; --ink2:#2B2333;
  --muted:#6E6577; --line:#D8CFC0; --accent:#FF3D6E; --accent-2:#12B6A6;
  --night:#15111A;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,"Courier New",monospace;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",SimSun,serif;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --wrap:1220px; --pad:clamp(18px,4.6vw,40px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,figure{margin:0}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--pad)}
.mono{font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.site-head{position:sticky;top:0;z-index:70;background:rgba(243,238,228,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head-in{height:68px;display:flex;align-items:center;gap:clamp(14px,3vw,32px)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-mark{width:32px;height:32px;flex:none;transition:transform .6s var(--ease-out)}
.brand:hover .brand-mark{transform:rotate(-14deg)}
.brand-name{font-weight:900;font-size:19px;letter-spacing:.08em;line-height:1}
.brand-sub{display:block;margin-top:4px;font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:8.5px;letter-spacing:.2em;color:var(--muted)}
.nav{display:flex;align-items:center;gap:clamp(12px,2.4vw,26px);margin-left:auto}
.nav-link{position:relative;font-size:14px;font-weight:700;padding:6px 2px;background:linear-gradient(currentColor 0 0) 0 100% / 0 2px no-repeat;transition:background-size .45s var(--ease-out),color .3s}
.nav-link:hover,.nav-link:focus-visible{background-size:100% 2px}
.nav-link.is-on{color:var(--accent)}
.nav-link.is-on::after{content:"";position:absolute;left:2px;right:2px;bottom:-1px;height:2px;background:var(--accent)}
.nav-sep{width:1px;height:20px;background:var(--line)}
.entry{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:11.5px;letter-spacing:.1em;font-weight:600;padding:8px 11px;border:1px solid var(--line);border-radius:2px;transition:border-color .3s,background .3s,color .3s}
.entry:hover{border-color:var(--ink);background:var(--ink);color:var(--paper2)}
.entry svg{width:12px;height:12px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,rgba(21,16,26,.085) 1px,transparent 0);background-size:20px 20px;mask-image:linear-gradient(105deg,transparent 42%,#000 96%);-webkit-mask-image:linear-gradient(105deg,transparent 42%,#000 96%);opacity:.55;z-index:0}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:clamp(18px,4vw,54px);align-items:center;padding-block:clamp(26px,4.4vw,58px) clamp(22px,3.2vw,40px)}
.sticker{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:800;font-size:12px;letter-spacing:.14em;padding:7px 12px;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-2.2deg)}
.sticker i{width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 2.4s var(--ease-io) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.hero h1{margin:20px 0 0;font-size:clamp(54px,10.6vw,142px);line-height:.9;font-weight:900;letter-spacing:-.01em}
.hero h1 .line{display:block;overflow:hidden;padding-block:.02em .08em}
.hero h1 .line>span{display:inline-block;white-space:nowrap}
.hero h1 em{font-style:normal;color:var(--accent);position:relative}
.hero-tag{display:flex;align-items:baseline;gap:14px;margin-top:14px;font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:11px;letter-spacing:.24em;color:var(--muted)}
.hero-tag b{font-family:var(--sans), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:15px;letter-spacing:.02em;color:var(--ink);font-weight:800}
.lede{margin-top:clamp(16px,2vw,22px);max-width:33ch;font-size:16px;line-height:1.85;color:var(--ink2)}
.hero-acts{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:clamp(20px,2.6vw,28px)}
.btn{position:relative;display:inline-flex;align-items:center;gap:9px;padding:14px 22px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper2);font-weight:800;font-size:14.5px;letter-spacing:.02em;border-radius:2px;overflow:hidden;isolation:isolate;transition:transform .3s var(--ease-out),color .3s,border-color .3s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent);transform:translate3d(0,101%,0);transition:transform .45s var(--ease-out)}
.btn:hover{transform:translateY(-2px);border-color:var(--ink);color:#fff}
.btn:hover::before{transform:none}
.btn:active{transform:translateY(0)}
.btn svg{width:15px;height:15px;transition:transform .35s var(--ease-out)}
.btn:hover svg{transform:translateX(4px)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost::before{background:var(--ink)}
.btn-ghost:hover{color:var(--paper2)}
.btn-sm{padding:9px 14px;font-size:13px;border-width:1px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn[disabled]::before{display:none}
.collage{position:relative;height:clamp(310px,41vw,452px);margin-right:16px}
.collage figure{position:absolute;margin:0;padding:7px 7px 0;background:#fff;border:1.5px solid var(--ink);box-shadow:7px 7px 0 rgba(21,16,26,.88);transition:transform .55s var(--ease-out)}
.collage figure:hover{transform:translateY(-8px) rotate(0deg) scale(1.02)}
.collage img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#e6dfd3}
.collage figcaption{padding:7px 2px 8px;font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:9.5px;letter-spacing:.14em;color:var(--ink2)}
.c1{width:52%;left:0;top:7%;transform:rotate(-5.5deg);z-index:1}
.c2{width:45%;right:0;top:0;transform:rotate(4.5deg);z-index:2}
.c3{width:41%;left:24%;bottom:0;transform:rotate(-1.6deg);z-index:3}
.collage .tape{position:absolute;left:50%;top:-11px;transform:translateX(-50%) rotate(-3deg);width:56px;height:18px;background:rgba(255,61,110,.72);mix-blend-mode:multiply}

/* ---------- marquee ---------- */
.marquee{display:flex;overflow:hidden;background:var(--ink);color:var(--paper);border-block:1.5px solid var(--ink);user-select:none}
.marquee-track{flex:none;display:flex;align-items:center;gap:26px;padding:11px 26px 11px 0;font-weight:800;font-size:13px;letter-spacing:.16em;white-space:nowrap;animation:marquee 42s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span.star{color:var(--accent);font-size:15px}
@keyframes marquee{to{transform:translate3d(-50%,0,0)}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.stat{padding:clamp(16px,2.4vw,26px) clamp(10px,2vw,24px);border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--sans), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-variant-numeric:tabular-nums;font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-.03em;line-height:1}
.stat span{display:block;margin-top:7px;font-size:11.5px;letter-spacing:.16em;color:var(--muted);font-weight:600}
</style>
<style>
/* ---------- sections ---------- */
.section{padding-block:clamp(38px,6vw,84px)}
section[id]{scroll-margin-top:84px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:16px;border-bottom:1.5px solid var(--ink)}
.kicker{display:flex;align-items:center;gap:9px;font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:10.5px;letter-spacing:.24em;color:var(--muted);font-weight:600}
.kicker::before{content:"";width:16px;height:1.5px;background:var(--accent)}
.sec-title{margin-top:10px;font-size:clamp(28px,4.4vw,54px);font-weight:900;line-height:1.03;letter-spacing:-.015em}
.sec-note{font-size:13.5px;color:var(--muted);max-width:28ch;line-height:1.7}

/* ---------- current round info ---------- */
.info-grid{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:clamp(22px,4.5vw,64px);padding-block:clamp(22px,3.4vw,36px)}
.round-big{font-family:var(--sans), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-variant-numeric:tabular-nums;font-size:clamp(74px,12vw,150px);font-weight:900;letter-spacing:-.055em;line-height:.82;display:flex;align-items:flex-start;gap:6px}
.round-big sup{font-size:13px;letter-spacing:.1em;font-weight:600;color:var(--muted);margin-top:10px;font-family:var(--sans), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif}
.round-state{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:6px 11px;border:1px solid var(--ink);font-size:11.5px;font-weight:800;letter-spacing:.12em}
.round-state i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2.4s var(--ease-io) infinite}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--ink);border-radius:999px;font-size:13px;font-weight:700;background:var(--paper2);transition:background .3s,color .3s,transform .3s var(--ease-out)}
.chip:hover{background:var(--ink);color:var(--paper2);transform:translateY(-2px)}
.chip::before{content:"#";color:var(--accent);font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:11px}
.chip:hover::before{color:#fff}
.detail-txt{margin-top:18px;font-size:15.5px;line-height:1.9;color:var(--ink2);max-width:46ch}
.rule-list{border-top:1px solid var(--line)}
.rule{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rule b{font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.06em;padding-top:3px}
.rule p{font-size:14.5px;line-height:1.75;color:var(--ink2)}
.rule:hover p{color:var(--ink)}

/* ---------- slots ---------- */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(9px,1.3vw,15px);padding-block:clamp(20px,2.6vw,30px) 4px}
.slot{position:relative;display:flex;flex-direction:column;min-height:clamp(150px,16vw,188px);padding:15px 15px 13px;border:1.5px solid var(--line);background:var(--paper2);border-radius:2px;text-align:left;transition:transform .4s var(--ease-out),border-color .3s,background .3s,box-shadow .3s}
.slot-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.slot-num{font-family:var(--sans), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-variant-numeric:tabular-nums;font-size:clamp(32px,3.8vw,44px);font-weight:900;letter-spacing:-.05em;line-height:.9}
.slot-meta{font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:9.5px;letter-spacing:.16em;font-weight:600;color:var(--muted);padding-top:4px}
.slot-body{margin-top:auto}
.slot-name{font-size:15.5px;font-weight:800;line-height:1.4;word-break:break-word}
.slot-time{font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.04em}
.slot-cta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.1em;color:var(--accent)}
.slot-cta svg{width:14px;height:14px;transition:transform .35s var(--ease-out)}
.slot--empty{border-style:dashed;background:transparent}
.slot--empty:hover{border-style:solid;border-color:var(--ink);background:#fff;transform:translateY(-5px);box-shadow:0 10px 0 -4px rgba(21,16,26,.14)}
.slot--empty:hover .slot-cta svg{transform:translateX(4px)}
.slot--empty .slot-num{color:var(--line)}
.slot--empty:hover .slot-num{color:var(--ink)}
.slot--taken{background:var(--night);color:var(--paper2);border-color:var(--night)}
.slot--taken .slot-meta,.slot--taken .slot-time{color:rgba(252,249,242,.5)}
.slot--taken:hover{transform:translateY(-3px)}
.slot--mine{box-shadow:inset 0 0 0 2.5px var(--accent)}
.pill{font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border:1px solid currentColor;border-radius:999px}
.slot--taken .pill{color:var(--accent)}
.slots-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:14px}
.add-slot{border:1.5px dashed var(--accent);color:var(--accent);padding:9px 15px;font-size:12.5px;font-weight:800;letter-spacing:.06em;transition:background .3s,color .3s}
.add-slot:hover{background:var(--accent);color:#fff}
.notice{display:flex;align-items:center;gap:10px;margin-top:16px;padding:13px 16px;background:#FFE7EC;border:1.5px solid var(--ink);font-size:13.5px;font-weight:700;line-height:1.5}
.notice b{color:var(--accent)}
.notice svg{width:17px;height:17px;flex:none}

/* ---------- featured ---------- */
.feat-stack{display:grid;gap:clamp(12px,1.8vw,20px);padding-top:clamp(20px,3vw,32px)}
.feat{position:relative;display:grid;overflow:hidden;background:var(--night);color:var(--paper2);border:1.5px solid var(--ink)}
.feat-a{grid-template-columns:1.1fr .9fr;min-height:clamp(280px,36vw,420px)}
.feat-b{grid-template-columns:.9fr 1.1fr;background:var(--paper2);color:var(--ink);min-height:clamp(260px,32vw,380px)}
.feat-media{overflow:hidden;background:#0e0b12;position:relative}
.feat-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s var(--ease-out)}
.feat:hover .feat-media img{transform:scale(1.045)}
.feat-body{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:clamp(20px,3vw,42px)}
.feat-label{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 11px;font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:10.5px;letter-spacing:.18em;font-weight:600;background:var(--accent);color:#fff;transform:rotate(-1.6deg)}
.feat-b .feat-label{background:var(--ink);transform:rotate(1.4deg)}
.feat h3{margin-top:16px;font-size:clamp(26px,3.4vw,42px);font-weight:900;line-height:1.08;letter-spacing:-.012em}
.feat p{margin-top:12px;font-size:14px;line-height:1.8;color:rgba(252,249,242,.72);max-width:30ch}
.feat-b p{color:var(--muted)}
.feat-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:11px;letter-spacing:.1em;color:rgba(252,249,242,.6)}
.feat-b .feat-meta{color:var(--muted)}
.feat-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;letter-spacing:.04em;border-bottom:1.5px solid currentColor;align-self:flex-start;padding-bottom:3px}
.feat-link svg{width:13px;height:13px;transition:transform .3s var(--ease-out)}
.feat-link:hover svg{transform:translateX(4px)}

/* ---------- archive index ---------- */
.arch-list{border-top:1.5px solid var(--ink)}
.arch-row{display:grid;grid-template-columns:78px minmax(0,1fr) minmax(0,1.1fr) 92px 34px;align-items:center;gap:clamp(10px,2vw,24px);padding:clamp(14px,2vw,20px) 4px;border-bottom:1px solid var(--line);transition:background .3s,padding .35s var(--ease-out)}
.arch-row:hover{background:var(--paper2);padding-inline:14px}
.arch-no{font-family:var(--sans), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-variant-numeric:tabular-nums;font-size:clamp(20px,2.4vw,28px);font-weight:900;letter-spacing:-.03em}
.arch-kw{font-size:14.5px;font-weight:700}
.arch-kw em{display:block;font-style:normal;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:3px}
.arch-desc{font-size:13px;color:var(--muted);line-height:1.7}
.arch-count{font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-align:right}
.arch-row svg{width:15px;height:15px;justify-self:end;transition:transform .35s var(--ease-out)}
.arch-row:hover svg{transform:translateX(5px);color:var(--accent)}

/* ---------- footer ---------- */
.foot{background:var(--night);color:var(--paper2);padding-block:clamp(40px,6vw,76px) 26px;margin-top:clamp(28px,4vw,56px);position:relative;overflow:hidden}
.foot::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1px,transparent 0);background-size:22px 22px;opacity:.5;pointer-events:none}
.foot-in{position:relative}
.foot-huge{font-size:clamp(46px,12vw,140px);font-weight:900;line-height:.88;letter-spacing:-.02em}
.foot-huge span{color:transparent;-webkit-text-stroke:1.8px rgba(252,249,242,.82)}
.foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:clamp(20px,4vw,54px);margin-top:clamp(28px,5vw,52px);padding-top:24px;border-top:1px solid rgba(252,249,242,.18)}
.foot-grid h4{font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:10px;letter-spacing:.22em;color:rgba(252,249,242,.45);font-weight:600;margin-bottom:12px}
.foot-grid p,.foot-grid a{display:block;font-size:13.5px;line-height:1.9;color:rgba(252,249,242,.78)}
.foot-grid a:hover{color:var(--accent)}
.foot-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:clamp(26px,4vw,44px);padding-top:16px;border-top:1px solid rgba(252,249,242,.18);font-size:11.5px;color:rgba(252,249,242,.42);font-family:var(--mono), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;letter-spacing:.06em}
</style>
<style>
/* ---------- gallery ---------- */
.page-head{padding-block:clamp(28px,4.4vw,60px) clamp(20px,2.6vw,32px);border-bottom:1.5px solid var(--ink)}
.page-title{font-size:clamp(40px,7.6vw,96px);font-weight:900;line-height:.95;letter-spacing:-.02em}
.page-lede{margin-top:16px;max-width:52ch;font-size:15.5px;line-height:1.85;color:var(--ink2)}
.gal{display:grid;grid-template-columns:184px minmax(0,1fr);gap:clamp(18px,4vw,54px);padding-block:clamp(22px,3vw,36px) 0;align-items:start}

/* ===== 三态状态 / 精选轮播 / 表单补充 ===== */
.st{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:3px;font-size:10px;font-weight:800;letter-spacing:.06em;line-height:1;white-space:nowrap;vertical-align:1px}
.st.st-open{background:var(--accent);color:#fff}
.st.st-ongoing{background:var(--accent-2);color:#fff}
.st.st-closed{background:rgba(21,16,26,.12);color:var(--ink)}
.hero-st{font-weight:800;letter-spacing:.08em}
.hero-st.st-open{color:var(--accent)}
.hero-st.st-ongoing{color:var(--accent-2)}
.hero-st.st-closed{color:var(--muted)}
.round-state i.st-ongoing{background:var(--accent-2)}
.round-state i.st-closed{background:var(--muted);animation:none}
.round-due{margin-top:9px;font-size:11.5px;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.gal-side a .st-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(21,16,26,.2);margin-right:6px;vertical-align:2px}
.gal-side a .st-dot.st-open{background:var(--accent)}
.gal-side a .st-dot.st-ongoing{background:var(--accent-2)}
.arch-count .st{margin-right:8px}
.round-head .when .st{margin-right:8px}
.slot--off{opacity:.6}
.slot--off .slot-cta{color:var(--muted)}
.notice--lock{background:rgba(18,182,166,.13)}
.notice--lock svg{color:var(--accent-2)}
.sec-side{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.feat-stack{transition:opacity .3s var(--ease-out),transform .3s var(--ease-out)}
.feat-stack.is-swap{opacity:0;transform:translateY(8px)}
.form-tip{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:#EFE9DD;border:1px solid var(--line);font-size:12px;line-height:1.65;color:var(--muted)}
.form-tip svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--accent)}
input[type=date],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;font-family:inherit, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;font-size:14.5px;color:var(--ink);border-radius:2px}
.wcard .wa button{white-space:nowrap}
.adm-row .rt .st{margin-right:9px}
@media(max-width:860px){.sec-side{justify-content:flex-start;align-items:flex-start;flex-direction:column;gap:10px}}
@media(prefers-reduced-motion:reduce){.feat-stack{transition:none}}
</style>
